[project]
name = "model-router"
version = "0.1.0"
description = "Python model router for OpenAI, Anthropic, and Google GenAI APIs"
readme = "README.md"
authors = [
    { name = "Antonio Quental", email = "antonio.quental@gmail.com" }
]
requires-python = ">=3.12.6"
dependencies = [
    "openai>=3.51.0",
    "anthropic==2.8.0",
    "google-genai==3.3.0",
    "tiktoken==0.14.0",
]

[project.scripts]
model-router = "model_router:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
